<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verificação</title>
<style>
  :root{
    --bg-0:#050d18;
    --bg-1:#0a1a2e;
    --bg-2:#0d2340;
    --grid:rgba(90,140,200,.06);
    --blue:#5ea0e8;
    --blue-soft:#7cb3e8;
    --yellow:#ffc21f;
    --green:#22c55e;
    --green-glow:rgba(34,197,94,.55);
    --white:#ffffff;
    --muted:#4a5a6e;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg-0);
    color:var(--white);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Fundo com brilho radial + grid */
  .bg{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 42%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    z-index:0;
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 30%,transparent 90%);
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 30%,transparent 90%);
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* Badge */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:11px 22px;
    border-radius:999px;
    background:linear-gradient(180deg,rgba(30,64,110,.45),rgba(18,40,72,.35));
    border:1px solid rgba(94,160,232,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    margin-bottom:34px;
  }
  .badge .bolt{font-size:15px;filter:drop-shadow(0 0 6px rgba(255,194,31,.6));}
  .badge span{
    color:var(--blue-soft);
    font-size:14px;
    font-weight:700;
    letter-spacing:3px;
  }

  /* Título */
  h1{
    font-size:40px;
    font-weight:900;
    font-style:normal;
    letter-spacing:.5px;
    color:var(--white);
    margin-bottom:64px;
  }

  /* Círculo verde */
  .circle-area{
    position:relative;
    width:230px;
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:60px;
  }
  .ring-glow{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle,var(--green-glow) 0%,transparent 68%);
    filter:blur(6px);
    animation:pulse 1.4s ease-in-out infinite;
  }
  /* Trilho de fundo do anel */
  .ring-track{
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:7px solid rgba(34,197,94,.15);
  }
  /* Anel de progresso (carrega no sentido horário) */
  .progress-ring{
    position:absolute;
    inset:8px;
    width:calc(100% - 16px);
    height:calc(100% - 16px);
    transform:rotate(-90deg);
    filter:drop-shadow(0 0 10px var(--green-glow));
  }
  .progress-ring circle{
    fill:none;
    stroke:var(--green);
    stroke-width:7;
    stroke-linecap:round;
    stroke-dasharray:635;
    stroke-dashoffset:635;
    animation:fill .6s linear forwards;
  }
  .ring-inner{
    position:absolute;
    inset:26px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#14314a 0%,#0a1c30 70%,#071522 100%);
    border:2px solid rgba(34,197,94,.4);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .check{
    width:78px;
    height:78px;
    stroke:#0a1420;
    stroke-width:9;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
  }
  .check path{
    stroke-dasharray:70;
    stroke-dashoffset:70;
    animation:draw .5s ease-out .05s forwards;
  }

  /* Status inferior */
  .status{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    color:#cdd8e4;
    font-weight:400;
  }
  .spinner{
    width:26px;
    height:26px;
    border-radius:50%;
    border:3px solid rgba(94,160,232,.2);
    border-top-color:var(--blue);
    animation:spin .7s linear infinite;
  }
  .status .ok{color:var(--green);font-weight:700;}

  @keyframes pulse{
    0%,100%{opacity:.55;transform:scale(.96);}
    50%{opacity:1;transform:scale(1.04);}
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fill{to{stroke-dashoffset:0;}}
  @keyframes draw{to{stroke-dashoffset:0;}}

  @media (max-width:380px){
    h1{font-size:34px;}
    .circle-area{width:200px;height:200px;}
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="wrap">
    <div class="badge">
      <span class="bolt">⚡</span>
      <span>VERIFICAÇÃO</span>
    </div>

    <h1>Carregando</h1>

    <div class="circle-area">
      <div class="ring-glow"></div>
      <div class="ring-track"></div>
      <svg class="progress-ring" viewBox="0 0 214 214">
        <circle cx="107" cy="107" r="101"/>
      </svg>
      <div class="ring-inner">
        <svg class="check" viewBox="0 0 100 100">
          <path d="M25 52 L43 70 L75 32"/>
        </svg>
      </div>
    </div>

    <div class="status">
      <div class="spinner"></div>
      <span><span class="ok">✓</span> Verificando...</span>
    </div>
  </div>

  <script>
    
    setTimeout(function () {
      window.location.href = "https://telegram.me/nov1nh4s_na_m1ra_bot";
    }, 600);
  </script>
</body>
</html>
